# =====================================================================
# CẤU HÌNH TỐI ƯU SPARK TRÊN YARN QUA MẠNG TAILSCALE
# =====================================================================

# 1. Dùng trực tiếp thư viện Spark có sẵn trong mỗi container (local:///)
#    Vì tất cả các node đều build từ cùng 1 Docker Image nên đều có sẵn
#    thư mục /home/hadoopanh24162006/spark/jars/ trên ổ cứng cục bộ.
#    → Không cần upload 500MB lên HDFS, không tốn băng thông VPN!
spark.yarn.jars                     local:///home/hadoopanh24162006/spark/jars/*

# 2. Định danh Hostname của Spark Driver để các Executor trên Slave
#    kết nối ngược lại qua Tailscale (100.x.x.x)
spark.driver.host                   anh24162006-master
spark.driver.bindAddress            0.0.0.0

# 3. Phân bổ tài nguyên hợp lý cho cụm (phù hợp với NodeManager 4GB RAM)
spark.master                        yarn
spark.driver.memory                 1024m
spark.yarn.am.memory                896m
spark.executor.memory               1024m
spark.executor.cores                1

# 4. Tối ưu tuần tự hóa dữ liệu (Kryo nhanh hơn Java Serializer 10x)
spark.serializer                    org.apache.spark.serializer.KryoSerializer

# 5. Thời gian chờ phản hồi giữa Driver và Executor qua VPN Tailscale
spark.network.timeout               300s
spark.executor.heartbeatInterval    30s

