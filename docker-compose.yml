services:
  hadoop-node:
    build: .
    image: bigdata-ecosystem:latest
    # Đổi hostname và container_name tương ứng trên từng laptop:
    # Máy 1: hoanganh24162006-master | Máy 2: hoc-slave1 | Máy 3: nguyen-slave2 | Máy 4: hoanganh24133004-slave3
    hostname: hoanganh24162006-master
    container_name: hoanganh24162006-master
    environment:
      - NODE_ROLE=master # Đổi thành 'slave' trên 3 máy Slave
    extra_hosts:
      - "hoanganh24162006-master:100.105.99.31"
      - "hoc-slave1:100.123.200.77"
      - "locnguyen21139037-slave2:100.106.204.115"
      - "hoanganh24133004-slave3:100.112.244.83"
    ports:
      - "2222:2222"     # SSH giữa các node (dùng port 2222 để an toàn, tránh trùng port 22 của máy thật)
      - "9000:9000"     # HDFS NameNode RPC
      - "9870:9870"     # HDFS NameNode Web UI
      - "9864:9864"     # HDFS DataNode Web UI
      - "9866:9866"     # HDFS DataNode Data Transfer
      - "9867:9867"     # HDFS DataNode IPC
      - "8030:8030"     # YARN ResourceManager Scheduler
      - "8031:8031"     # YARN ResourceManager Tracker
      - "8032:8032"     # YARN ResourceManager Address
      - "8033:8033"     # YARN ResourceManager Admin
      - "8088:8088"     # YARN ResourceManager Web UI
      - "8042:8042"     # YARN NodeManager Web UI
      - "10020:10020"   # MapReduce JobHistory RPC
      - "19888:19888"   # MapReduce JobHistory Web UI
      - "10000:10000"   # HiveServer2
      - "7077:7077"     # Spark Standalone Master
      - "8080:8080"     # Spark Master Web UI
      - "4040:4040"     # Spark Application UI
    volumes:
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh
      - ./config/core-site.xml:/home/hadoophoanganh24162006/hadoop/etc/hadoop/core-site.xml
      - ./config/hdfs-site.xml:/home/hadoophoanganh24162006/hadoop/etc/hadoop/hdfs-site.xml
      - ./config/yarn-site.xml:/home/hadoophoanganh24162006/hadoop/etc/hadoop/yarn-site.xml
      - ./config/mapred-site.xml:/home/hadoophoanganh24162006/hadoop/etc/hadoop/mapred-site.xml
      - ./config/workers:/home/hadoophoanganh24162006/hadoop/etc/hadoop/workers
      - ./config/workers:/home/hadoophoanganh24162006/spark/conf/workers
      - ./config/hive-site.xml:/home/hadoophoanganh24162006/hive/conf/hive-site.xml
      - ./test_bigdata:/home/hadoophoanganh24162006/test_bigdata
      - hadoop_data:/home/hadoophoanganh24162006/hadoop/hdfs
    restart: unless-stopped

volumes:
  hadoop_data: